<script>
// ══════════════════════════════════════════════════════════════
// PASTE YOUR GOOGLE SHEETS CSV URL HERE
// ══════════════════════════════════════════════════════════════
const RI_SHEET_URL = ''; // ← e.g. 'https://docs.google.com/spreadsheets/d/ABC/gviz/tq?tqx=out:csv&sheet=Volleyball'

// ══════════════════════════════════════════════════════════════
// ENGINE — do not edit below
// ══════════════════════════════════════════════════════════════
function riPct(w,l){ return w+l===0?'—':(w/(w+l)).toFixed(3).replace(/^0/,''); }
function riGB(topW,topL,w,l){
  if(topW===w&&topL===l) return '—';
  return (((topW-topL)-(w-l))/2).toFixed(1).replace(/\.0$/,'');
}
function riPctCol(w,l){ if(w+l===0)return '#7A95A8'; const p=w/(w+l); return p>=.6?'#1A9E6A':p>=.4?'#C27800':'#7A95A8'; }
function riLast5(s){
  if(!s||s.length<1) return '<span style="color:#7A95A8;">—</span>';
  return s.split('').slice(-5).map(c=>
    `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${c.toUpperCase()==='W'?'#1A9E6A':'#B52A2A'};font-family:Barlow Condensed,sans-serif;font-size:8px;font-weight:800;color:#fff;text-align:center;line-height:14px;margin:0 1px;">${c.toUpperCase()}</span>`
  ).join('');
}
function riParseCSV(t){
  return t.trim().split('\n').map(r=>{
    const res=[]; let c='',q=false;
    for(const ch of r){ if(ch==='"')q=!q; else if(ch===','&&!q){res.push(c.trim());c='';}else c+=ch; }
    res.push(c.trim()); return res;
  });
}
function riTime(){
  const d=new Date();
  return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

async function riLoad(){
  if(!RI_SHEET_URL) return;
  try {
    const res = await fetch(RI_SHEET_URL+'&t='+Date.now());
    const text = await res.text();
    const rows = riParseCSV(text).slice(1)
      .map(r=>({team:r[1]||'',w:parseInt(r[2])||0,l:parseInt(r[3])||0,streak:r[6]||'',note:r[7]||''}))
      .filter(r=>r.team);
    if(!rows.length) return;
    rows.sort((a,b)=>b.w-a.w||a.l-b.l);
    const top=rows[0];
    const tbody=document.getElementById('ri-body');
    tbody.style.animation='ri-fade .3s ease';
    tbody.innerHTML=rows.map((r,i)=>{
      const gb=riGB(top.w,top.l,r.w,r.l);
      const strW=r.streak&&r.streak[0]==='W';
      return `<tr style="border-bottom:1px solid #DDE4EC;${i===0?'border-left:3px solid #CC2B2B;background:rgba(0,36,58,.02);':''}">
        <td style="padding:13px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:${i===0?'#00243A':'#7A95A8'};">${i+1}</span></td>
        <td style="padding:13px 16px;">
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#00243A;">${r.team}</div>
          ${r.note?`<div style="font-size:11px;color:#7A95A8;">${r.note}</div>`:''}
        </td>
        <td style="padding:13px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:#00243A;">${r.w}</span></td>
        <td style="padding:13px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#B52A2A;">${r.l}</span></td>
        <td style="padding:13px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:${riPctCol(r.w,r.l)};">${riPct(r.w,r.l)}</span></td>
        <td style="padding:13px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:#3A5568;">${gb}</span></td>
        <td style="padding:13px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:${strW?'#1A9E6A':'#B52A2A'};">${r.streak||'—'}</span></td>
        <td style="padding:13px 16px;text-align:center;">${riLast5(r.streak)}</td>
      </tr>`;
    }).join('');
    const upd=document.getElementById('ri-updated');
    if(upd) upd.textContent='Last updated: '+riTime();
  }catch(e){
    const upd=document.getElementById('ri-updated');
    if(upd) upd.textContent='Could not load — check Sheet URL';
  }
}

riLoad();
setInterval(riLoad,60000);
</script>
