<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Outdoor Basketball Standings — Royals Intramurals</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Barlow',sans-serif; background:#fff; color:#00243A; }
    @keyframes ri-fade { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body style="margin:0;padding:0;background:#fff;">

<div style="background:#00243A;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #CC2B2B;">
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:24px;">🏀</span>
    <div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.4);">Redeemer Intramurals · 2026/27</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:#fff;line-height:1.1;">Outdoor Basketball <span style="color:#CC2B2B;">Standings</span></div>
    </div>
  </div>
  <div style="text-align:right;">
    <div style="display:flex;align-items:center;gap:5px;justify-content:flex-end;">
      <div style="width:6px;height:6px;border-radius:50%;background:#1A9E6A;"></div>
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.5);">Live</span>
    </div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;color:rgba(255,255,255,.3);margin-top:2px;" id="ri-updated">Loading...</div>
  </div>
</div>

<table style="width:100%;border-collapse:collapse;">
  <thead>
    <tr style="background:#F4F7FA;border-bottom:2px solid #DDE4EC;">
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:10px 16px;text-align:center;width:40px;">#</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:10px 16px;text-align:left;">Team</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:10px 16px;text-align:center;">W</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:10px 16px;text-align:center;">L</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:10px 16px;text-align:center;">PCT</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:10px 16px;text-align:center;">GB</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:10px 16px;text-align:center;">Streak</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:10px 16px;text-align:center;">Last 5</th>
    </tr>
  </thead>
  <tbody id="ri-body">
    <tr><td colspan="8" style="padding:32px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#7A95A8;">Loading standings...</td></tr>
  </tbody>
</table>

<div style="background:#F4F7FA;border-top:1px solid #DDE4EC;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;">
  <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#7A95A8;">Auto-refreshes every 60s</span>
  <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#CC2B2B;">Redeemer Royals Intramurals</span>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRVnm-wZP1UHa-SnZ5l6wznGddqt87H2Z7hm0_8sil3Y25dXyaiCFd-sE09zSd2U_SXg/exec';
const SHEET_TAB = 'OutdoorBasketball-Standings';
const CACHE_KEY = 'ri_standings_OutdoorBasketball-Standings';

function riPct(w,l){ return w+l===0?'—':(w/(w+l)).toFixed(3).replace(/^0/,''); }
function riPctCol(w,l){ if(w+l===0)return '#7A95A8'; const p=w/(w+l); return p>=.6?'#1A9E6A':p>=.4?'#C27800':'#7A95A8'; }
function riGB(tw,tl,w,l){ if(tw===w&&tl===l)return '—'; return (((tw-tl)-(w-l))/2).toFixed(1).replace(/\.0$/,''); }
function riLast5(s){
  if(!s) return '<span style="color:#7A95A8">—</span>';
  return s.toUpperCase().split('').filter(c=>c==='W'||c==='L').slice(-5)
    .map(c=>`<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${c==='W'?'#1A9E6A':'#B52A2A'};font-family:'Barlow Condensed',sans-serif;font-size:8px;font-weight:800;color:#fff;text-align:center;line-height:14px;margin:0 1px;">${c}</span>`).join('');
}
function riStatus(msg){ const el=document.getElementById('ri-updated'); if(el) el.textContent=msg; }
function riClean(s){ return (s||'').toString().replace(/^"+|"+$/g,'').trim(); }

function riRender(rows, fromCache){
  if(!rows||!rows.length){ 
    document.getElementById('ri-body').innerHTML='<tr><td colspan="8" style="padding:32px;text-align:center;font-family:Barlow Condensed,sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#7A95A8;">Season not started yet</td></tr>';
    return; 
  }
  rows.sort((a,b)=>b.w-a.w||a.l-b.l||(b.pf-b.pa)-(a.pf-a.pa));
  const top=rows[0];
  document.getElementById('ri-body').innerHTML=rows.map((r,i)=>{
    const first=i===0;
    const hist=r.streak.replace(/[^wWlL]/g,'');
    const last=hist.slice(-1).toUpperCase();
    const strDisplay=last?last+hist.length:'—';
    const strColor=last==='W'?'#1A9E6A':last==='L'?'#B52A2A':'#7A95A8';
    return `<tr style="border-bottom:1px solid #DDE4EC;${first?'border-left:3px solid #CC2B2B;background:rgba(0,36,58,.02);':''}">
      <td style="padding:12px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;color:${first?'#00243A':'#7A95A8'};">${i+1}</span></td>
      <td style="padding:12px 16px;"><div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:#00243A;">${r.team}</div>${r.note?`<div style="font-size:11px;color:#7A95A8;">${r.note}</div>`:''}</td>
      <td style="padding:12px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:#00243A;">${r.w}</span></td>
      <td style="padding:12px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#B52A2A;">${r.l}</span></td>
      <td style="padding:12px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:${riPctCol(r.w,r.l)};">${riPct(r.w,r.l)}</span></td>
      <td style="padding:12px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:#3A5568;">${riGB(top.w,top.l,r.w,r.l)}</span></td>
      <td style="padding:12px 16px;text-align:center;"><span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:${strColor};">${strDisplay}</span></td>
      <td style="padding:12px 16px;text-align:center;">${riLast5(r.streak)}</td>
    </tr>`;
  }).join('');
  if(fromCache) riStatus('Cached · refreshing...');
}

function riLoadCache(){
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if(cached){
      const data = JSON.parse(cached);
      riRender(data, true);
      return true;
    }
  } catch(e){}
  return false;
}

function riSaveCache(rows){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(rows)); } catch(e){}
}

async function riLoad(){
  try {
    const url = APPS_SCRIPT_URL + '?tab=' + encodeURIComponent(SHEET_TAB) + '&t=' + Date.now();
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(json.error) throw new Error(json.error);
    const rows = (json.rows||[]).map(r=>{
      const teamKey   = Object.keys(r).find(k=>k.trim().toLowerCase()==='team name')||'';
      const wKey      = Object.keys(r).find(k=>k.trim().toLowerCase()==='w')||'';
      const lKey      = Object.keys(r).find(k=>k.trim().toLowerCase()==='l')||'';
      const gfKey     = Object.keys(r).find(k=>k.trim().toLowerCase()==='gf')||'';
      const gaKey     = Object.keys(r).find(k=>k.trim().toLowerCase()==='ga')||'';
      const streakKey = Object.keys(r).find(k=>k.trim().toLowerCase()==='streak')||'';
      const noteKey   = Object.keys(r).find(k=>k.trim().toLowerCase()==='notes')||'';
      return {
        team:   riClean(r[teamKey]||''),
        w:      parseInt(r[wKey])||0,
        l:      parseInt(r[lKey])||0,
        pf:     parseInt(r[gfKey])||0,
        pa:     parseInt(r[gaKey])||0,
        streak: riClean(r[streakKey]||''),
        note:   riClean(r[noteKey]||''),
      };
    }).filter(r=>r.team&&r.team!=='Team Name'&&r.team!=='');
    riSaveCache(rows);
    riRender(rows, false);
    riStatus('Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  } catch(e){
    riStatus('Refresh failed · showing cached data');
    console.error('Standings error:',e);
  }
}

// Load cache instantly, then fetch fresh data
riLoadCache();
riLoad();
setInterval(riLoad, 60000);
</script>
</body>
</html>
