<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Soccer II Schedule — Royals Intramurals</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Barlow',sans-serif; background:#fff; color:#00243A; }
  </style>
</head>
<body style="margin:0;padding:0;background:#fff;">

<div style="background:#00243A;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #CC2B2B;">
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="font-size:24px;">⚽</span>
    <div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.4);">Redeemer Intramurals · 2026/27</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:#fff;line-height:1.1;">Soccer II <span style="color:#CC2B2B;">Schedule</span></div>
    </div>
  </div>
  <div style="text-align:right;">
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.5);" id="ri-filter-label">All Games</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;color:rgba(255,255,255,.3);margin-top:2px;" id="ri-updated">Loading...</div>
  </div>
</div>

<div style="background:#F4F7FA;border-bottom:1px solid #DDE4EC;display:flex;gap:0;">
  <button onclick="riFilter('all',this)" id="btn-all" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#CC2B2B;background:none;border:none;border-bottom:2px solid #CC2B2B;padding:10px 16px;cursor:pointer;margin-bottom:-1px;">All Games</button>
  <button onclick="riFilter('upcoming',this)" id="btn-upcoming" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#7A95A8;background:none;border:none;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;margin-bottom:-1px;">Upcoming</button>
  <button onclick="riFilter('results',this)" id="btn-results" style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#7A95A8;background:none;border:none;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;margin-bottom:-1px;">Results</button>
</div>

<table style="width:100%;border-collapse:collapse;">
  <thead>
    <tr style="background:#F4F7FA;border-bottom:2px solid #DDE4EC;">
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:9px 16px;text-align:left;">Date</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:9px 16px;text-align:left;">Time</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:9px 16px;text-align:left;">Matchup</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:9px 16px;text-align:left;">Location</th>
      <th style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7A95A8;padding:9px 16px;text-align:center;">Result</th>
    </tr>
  </thead>
  <tbody id="ri-body">
    <tr><td colspan="5" style="padding:32px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#7A95A8;">Loading schedule...</td></tr>
  </tbody>
</table>

<div style="background:#F4F7FA;border-top:1px solid #DDE4EC;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;">
  <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#7A95A8;">Auto-refreshes every 60s</span>
  <span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#CC2B2B;">Redeemer Royals Intramurals</span>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxRVnm-wZP1UHa-SnZ5l6wznGddqt87H2Z7hm0_8sil3Y25dXyaiCFd-sE09zSd2U_SXg/exec';
const SHEET_TAB = 'SoccerII-Schedule';
const CACHE_KEY = 'ri_schedule_SoccerII-Schedule';

let allGames = [];
let activeFilter = 'all';

function riStatus(msg){ const el=document.getElementById('ri-updated'); if(el) el.textContent=msg; }
function riSetFilter(label){ const el=document.getElementById('ri-filter-label'); if(el) el.textContent=label; }
function riClean(s){ return (s||'').toString().trim(); }
function riIsPlayed(r){ return r&&r!==''&&r!=='—'&&r!=='TBD'; }

function riFindKey(obj, candidates){
  const keys=Object.keys(obj).map(k=>k.toLowerCase().trim());
  for(const c of candidates){
    const idx=keys.indexOf(c.toLowerCase());
    if(idx!==-1) return Object.keys(obj)[idx];
  }
  return null;
}

function riRenderRows(games){
  if(!games.length){
    document.getElementById('ri-body').innerHTML=`<tr><td colspan="5" style="padding:32px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#7A95A8;">No games to show</td></tr>`;
    return;
  }
  document.getElementById('ri-body').innerHTML=games.map((g,i)=>{
    const played=riIsPlayed(g.result);
    const bg=i%2===0?'#fff':'#F9FAFC';
    return `<tr style="border-bottom:1px solid #DDE4EC;background:${bg};">
      <td style="padding:13px 16px;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:900;color:#00243A;line-height:1;">${g.date||'TBD'}</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#CC2B2B;">${g.day||''}</div>
      </td>
      <td style="padding:13px 16px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#00243A;">${g.time||'TBD'}</td>
      <td style="padding:13px 16px;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:#00243A;">${g.home} <span style="color:#CC2B2B;font-weight:600;">vs</span> ${g.away}</div>
        ${g.notes?`<div style="font-size:11px;color:#7A95A8;margin-top:2px;">${g.notes}</div>`:''}
      </td>
      <td style="padding:13px 16px;font-size:13px;color:#3A5568;">${g.location||'Athletic Centre'}</td>
      <td style="padding:13px 16px;text-align:center;">
        ${played
          ?`<span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;color:#00243A;background:#EEF2F6;padding:4px 10px;border-radius:3px;">${g.result}</span>`
          :`<span style="font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:rgba(204,43,43,.08);color:#CC2B2B;padding:4px 10px;border-radius:2px;">Upcoming</span>`
        }
      </td>
    </tr>`;
  }).join('');
}

function riFilter(type, btn){
  activeFilter=type;
  document.querySelectorAll('[id^="btn-"]').forEach(b=>{ b.style.color='#7A95A8'; b.style.borderBottom='2px solid transparent'; });
  btn.style.color='#CC2B2B'; btn.style.borderBottom='2px solid #CC2B2B';
  if(type==='all'){ riSetFilter('All Games'); riRenderRows(allGames); }
  else if(type==='upcoming'){ riSetFilter('Upcoming'); riRenderRows(allGames.filter(g=>!riIsPlayed(g.result))); }
  else if(type==='results'){ riSetFilter('Results'); riRenderRows(allGames.filter(g=>riIsPlayed(g.result))); }
}

function riLoadCache(){
  try {
    const cached=localStorage.getItem(CACHE_KEY);
    if(cached){
      allGames=JSON.parse(cached);
      riFilter(activeFilter, document.getElementById('btn-'+activeFilter));
      riStatus('Cached · refreshing...');
      return true;
    }
  } catch(e){}
  return false;
}

function riSaveCache(games){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(games)); } catch(e){}
}

async function riLoad(){
  try {
    const url=APPS_SCRIPT_URL+'?tab='+encodeURIComponent(SHEET_TAB)+'&t='+Date.now();
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const json=await res.json();
    if(json.error) throw new Error(json.error);
    if(!json.rows||!json.rows.length){
      riStatus('Sheet connected — add games to see schedule');
      return;
    }
    const games=json.rows.map(r=>{
      const homeKey    =riFindKey(r,['Home Team','Home','home team','home']);
      const awayKey    =riFindKey(r,['Away Team','Away','away team','away']);
      const dateKey    =riFindKey(r,['Date','date']);
      const dayKey     =riFindKey(r,['Day','day']);
      const timeKey    =riFindKey(r,['Time','time']);
      const scoreKey   =riFindKey(r,['Score','Result','score','result']);
      const locationKey=riFindKey(r,['Location','location','venue','Venue']);
      const notesKey   =riFindKey(r,['Notes','notes']);
      return {
        home:    riClean(homeKey    ?r[homeKey]    :''),
        away:    riClean(awayKey    ?r[awayKey]    :''),
        date:    riClean(dateKey    ?r[dateKey]    :''),
        day:     riClean(dayKey     ?r[dayKey]     :''),
        time:    riClean(timeKey    ?r[timeKey]    :''),
        result:  riClean(scoreKey   ?r[scoreKey]   :''),
        location:riClean(locationKey?r[locationKey]:''),
        notes:   riClean(notesKey   ?r[notesKey]   :''),
      };
    }).filter(g=>g.home!==''&&g.home!=='Home Team');
    if(games.length){
      allGames=games;
      riSaveCache(games);
      riFilter(activeFilter,document.getElementById('btn-'+activeFilter));
      riStatus('Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
    } else {
      riStatus('Sheet connected — no games found');
    }
  } catch(e){
    riStatus('Refresh failed · showing cached data');
    console.error('Schedule error:',e);
  }
}

riLoadCache();
riLoad();
setInterval(riLoad,60000);
</script>
</body>
</html>
